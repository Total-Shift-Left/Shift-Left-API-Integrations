# Optional: create a pipeline in Azure DevOps with this file as the YAML source path
# to run tests and build the ShiftLeft extension VSIX on each change.
#
# The authoritative build is .github/workflows/ci.yml; keep the two in step.
name: shiftleft-ado-extension-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - master
      - main
  paths:
    include:
      - azure-devops/*

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Use Node 20

  # npm workspaces repo: install once at the root. Dependencies hoist there, which is exactly why
  # the task cannot be packaged as a directory of node_modules.
  - script: npm ci --no-audit --no-fund
    displayName: npm ci (workspaces root)

  - script: npm test
    displayName: npm test

  - script: npm run generate-extension-icon --workspace=azure-devops/shiftleft-api-integration-task
    displayName: Icon generation (verifies Sharp works on the agent)

  # Agents never install dependencies for a task, so the task must be a self-contained bundle.
  - script: npm run build:azure-task
    displayName: Build the task bundle (ncc)

  - script: npm install -g tfx-cli
    displayName: Install tfx-cli

  - script: |
      cd azure-devops
      tfx extension create --manifest-globs vss-extension.json --output-path "$(Build.ArtifactStagingDirectory)"
    displayName: tfx extension create

  # A VSIX missing a dependency packages cleanly and only fails at runtime, on "Cannot find
  # module". Load the packaged entry point for real so that failure lands here instead.
  - script: |
      set -euo pipefail
      unzip -q "$(Build.ArtifactStagingDirectory)"/*.vsix -d "$(Agent.TempDirectory)/vsix"
      cd "$(Agent.TempDirectory)/vsix/shiftleft-api-integration-task"
      node -e "if (typeof require('./dist/index.js').run !== 'function') throw new Error('bad bundle')"
    displayName: Verify the packaged task resolves its dependencies

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifact: 'shiftleft-ado-extension'
      publishLocation: 'pipeline'
    displayName: Publish the .vsix
