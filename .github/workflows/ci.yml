name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    name: Node packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      # The Action runs dist/index.js straight from the repo with no install step, so a stale
      # bundle ships a broken action to every consumer. Fail here rather than there.
      - name: Verify the committed Action bundle is current
        run: |
          npm run build:action
          git diff --exit-code -- github-actions/dist \
            || { echo "::error::github-actions/dist is stale - run 'npm run build:action' and commit the result"; exit 1; }

  jenkins:
    name: Jenkins plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Jenkins 2.479.x LTS baseline requires Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        working-directory: jenkins
        run: mvn -B -ntp verify

      - uses: actions/upload-artifact@v4
        with:
          name: jenkins-hpi
          path: jenkins/target/*.hpi
          if-no-files-found: error

  azure-devops:
    name: Azure DevOps extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Package .vsix
        run: |
          npm install -g tfx-cli
          cd azure-devops
          tfx extension create --manifest-globs vss-extension.json --output-path "$RUNNER_TEMP/vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: azure-devops-vsix
          path: ${{ runner.temp }}/vsix/*.vsix
          if-no-files-found: error
