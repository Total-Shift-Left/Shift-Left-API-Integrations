name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    name: Node packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      # The Action runs dist/index.js straight from the repo with no install step, so a stale
      # bundle ships a broken action to every consumer. Fail here rather than there.
      - name: Verify the committed Action bundle is current
        run: |
          npm run build:action
          git diff --exit-code -- github-actions/dist \
            || { echo "::error::github-actions/dist is stale - run 'npm run build:action' and commit the result"; exit 1; }

  jenkins:
    name: Jenkins plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Jenkins 2.479.x LTS baseline requires Java 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        working-directory: jenkins
        run: mvn -B -ntp verify

      - uses: actions/upload-artifact@v7
        with:
          name: jenkins-hpi
          path: jenkins/target/*.hpi
          if-no-files-found: error

  azure-devops:
    name: Azure DevOps extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm install --no-audit --no-fund

      # Azure Pipelines agents never run an install step for a task, so every dependency has to be
      # inside the .vsix. This is a workspaces repo - deps hoist to the root node_modules and the
      # task directory has none of its own - so bundle the task with ncc instead, exactly like the
      # Action. task.json points its execution target at dist/index.js.
      - name: Build the task bundle
        run: npm run build:azure-task

      - name: Package .vsix
        run: |
          npm install -g tfx-cli
          cd azure-devops
          tfx extension create --manifest-globs vss-extension.json --output-path "$RUNNER_TEMP/vsix"

      # A .vsix that is missing a dependency still packages fine and only fails on the agent, at
      # "Cannot find module". Unpack it and load the entry point for real so that failure lands here.
      - name: Verify the packaged task resolves its dependencies
        run: |
          set -euo pipefail
          unzip -q "$RUNNER_TEMP"/vsix/*.vsix -d "$RUNNER_TEMP/vsix-unpacked"
          task_dir="$RUNNER_TEMP/vsix-unpacked/shiftleft-api-integration-task"

          echo "Packaged task contents:"
          find "$task_dir" -type f | sort

          for unwanted in __tests__ scripts node_modules; do
            if [ -e "$task_dir/$unwanted" ]; then
              echo "::error::$unwanted was packaged into the .vsix"; exit 1
            fi
          done

          target=$(node -p "require('$task_dir/task.json').execution.Node20_1.target")
          [ -f "$task_dir/$target" ] || { echo "::error::task.json target $target is not in the .vsix"; exit 1; }

          # require() rather than run: the entry point guards on require.main, so this resolves
          # every dependency without starting a test run.
          ( cd "$task_dir" && node -e "
            const m = require('./$target');
            if (typeof m.run !== 'function') { throw new Error('bundle did not export run()'); }
            console.log('resolved every require from inside the .vsix');
          " )

      - uses: actions/upload-artifact@v7
        with:
          name: azure-devops-vsix
          path: ${{ runner.temp }}/vsix/*.vsix
          if-no-files-found: error
